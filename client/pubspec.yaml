# A Flutter-kliens projekt-leírója.
#
# Cél: DESKTOP-FIRST (Windows/Mac/Linux) app, ami egy lokális (localhost) backendtől
# lekéri a Tracking JSON-t, és kirajzolja a felülnézeti taktikai pályát. Ugyanez a
# kódbázis fordul tabletre (iPad/Android) is. Lásd client/README.md.

name: handball_client
description: Kézilabda elemző kliens — felülnézeti taktikai nézet (desktop-first).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0          # a lokális backend REST API-jának hívásához
  crypto: ^3.0.3        # a letöltött frissítés sha256-ellenőrzéséhez
  file_picker: ^8.0.0   # meccsvideó kiválasztása (desktop/tablet natív fájlválasztó)
  video_player: ^2.9.0  # jelenet-visszajátszás az elemzés mellett (macOS/iOS/Android)
  media_kit: ^1.1.10    # jelenet-visszajátszás Windowson (libmpv-alapú lejátszó)
  media_kit_video: ^1.2.4                # a media_kit videó-felülete
  media_kit_libs_windows_video: ^1.0.9   # a natív lejátszó-könyvtárak (csak Windows)

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
